<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Atrium CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: frosted glass cards on a deep-blue canvas. Sidebar groups CRM / Marketing / Workspace; each business unit (Residential, Commercial) has its own data and dashboard. Controls are solid ocean blue so they stand out from the glass. */
:root{
  color-scheme:dark;
  /* canvas */
  --bg:#0B132B; --bg2:#1C2541;
  /* text */
  --fg:#FFFFFF; --muted:#ABC4FF; --faint:rgba(171,196,255,.68);
  /* glass: white 10%, border white 20% */
  --glass:rgba(255,255,255,.10); --glass-2:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.20);
  --line:rgba(255,255,255,.20); --line-2:rgba(255,255,255,.30);
  --grid:rgba(171,196,255,.045); --solid:#111C3A;
  --shadow:0 18px 50px rgba(4,9,26,.45);
  /* solid action controls */
  --action:#0077B6; --action-hover:#0088CF; --action-done:#0B4F7A; --tab:#1B2A52;
  /* accents for charts, links and focus */
  --acc:#ABC4FF; --acc-2:#FFFFFF; --on-acc:#0B132B;
  /* status */
  --good:#4CAF50; --warn:#FFC107; --bad:#F44336; --info:#ABC4FF;
  /* paper previews (emails, landing pages) */
  --paper:#ffffff; --ink:#1c2628; --ink-2:#5b6b6e; --paper-line:#e4ebec;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-lg:20px; --r-md:14px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc,#34d1a1);outline-offset:2px}
.app{position:relative;height:100%;display:grid;grid-template-columns:236px minmax(0,1fr);gap:12px;
  padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(160deg,#0B132B 0%,#1C2541 100%)}
.sky::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 85%)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow)}
.sidebar,.main{position:relative;z-index:1;min-height:0}

.sidebar{display:flex;flex-direction:column;gap:12px;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--action);color:#FFFFFF}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:12px;background:var(--tab);position:relative}
.seg button{position:relative;z-index:1;border:0;background:none;padding:7px 6px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{color:#FFFFFF}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:9px;background:var(--action);transition:transform .35s cubic-bezier(.3,.7,.2,1)}
.app[data-seg="com"] .seg .thumb{transform:translateX(100%)}
.nav{display:flex;flex-direction:column;gap:1px;overflow:auto;min-height:0;flex:1;margin:0 -4px;padding:0 4px;scrollbar-width:thin}
.nav-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);padding:10px 10px 3px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;border:1px solid transparent}
.nav a:hover{background:var(--tab);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--action);color:#FFFFFF;border-color:transparent}
.nav a[aria-current="page"] svg{color:#FFFFFF}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.nav .badge{margin-left:auto;font-size:10.5px;font-weight:700;background:#FFFFFF;color:var(--action);border-radius:999px;padding:0 7px}
.side-foot{display:flex;flex-direction:column;gap:10px}
.ks-card{padding:12px;border-radius:15px;background:var(--action);border:0;color:#FFFFFF;display:flex;align-items:center;gap:10px}
.ks-card b{display:block;font-size:13px}
.ks-card small{color:rgba(255,255,255,.85);font-size:11.5px;line-height:1.3;display:block}
svg.i{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.main{display:flex;flex-direction:column;gap:12px;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:9px 12px}
.page-title{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.015em;margin:0;line-height:1.2;text-wrap:balance}
.crumb{font-size:11.5px;color:var(--muted)}
.crumb a{text-decoration:none}
.search{flex:1;max-width:360px;margin-left:auto;position:relative}
.search input{width:100%;padding:8px 12px 8px 34px;border-radius:11px;border:1px solid var(--line);background:var(--glass);outline:none}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.sync-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass);white-space:nowrap;text-decoration:none}
.live{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
.iconbtn{width:36px;height:36px;border-radius:11px;border:0;background:var(--action);display:grid;place-items:center;color:#FFFFFF;flex:none}
.iconbtn:hover{background:var(--action-hover);color:#FFFFFF}
.iconbtn.sm{width:28px;height:28px;border-radius:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:0;background:var(--action);color:#FFFFFF;padding:8px 13px;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--action-hover)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--action);color:#FFFFFF;font-weight:700;box-shadow:0 6px 18px rgba(0,119,182,.4)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.btn.ks svg{color:#FFFFFF}
.btn.danger{background:var(--bad);color:#FFFFFF}
.btn.danger:hover{background:#E53935}
.scroll{flex:1;overflow:auto;min-height:0;padding:1px 1px 30px;scrollbar-width:thin}
.view{display:flex;flex-direction:column;gap:12px;animation:rise .4s ease both}
@keyframes rise{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.seg .thumb{transition:none}.live{animation:none}}

.panel{padding:16px}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h2,.panel-h h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:-.01em}
.panel-h .sub{color:var(--muted);font-size:12px}
.right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.eyebrow{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:12px}
.note{font-size:12px;color:var(--faint)}
.h2{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;text-decoration:none}
.kpi .val{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.kpi .delta{font-size:12px;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--bad)}
.kpi svg.spark{width:100%;height:30px;margin-top:4px}
.g2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g2>*,.g3>*,.g2e>*{min-width:0}
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}
.calwrap>*{min-width:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--glass);white-space:nowrap}
.chip.good{color:var(--good);background:rgba(76,175,80,.16);border-color:rgba(76,175,80,.55)}
.chip.warn{color:var(--warn);background:rgba(255,193,7,.14);border-color:rgba(255,193,7,.55)}
.chip.bad{color:var(--bad);background:rgba(244,67,54,.16);border-color:rgba(244,67,54,.55)}
.chip.acc{color:#FFFFFF;background:rgba(0,119,182,.35);border-color:rgba(0,119,182,.8)}
.chip.info{color:var(--info);background:rgba(171,196,255,.12);border-color:rgba(171,196,255,.45)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs button{border:0;background:var(--tab);padding:7px 13px;font-weight:600;font-size:13px;color:var(--muted);border-radius:9px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--action);color:#FFFFFF}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{display:inline-flex;align-items:center;gap:5px;border:0;background:var(--tab);padding:6px 12px;border-radius:9px;font-size:12px;font-weight:600;color:var(--muted)}
.pills button[aria-pressed="true"]{background:var(--action);color:#FFFFFF}
select.sel,input.inp{padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--glass);outline:none;font-size:12.5px}
select option{background:var(--action);color:#FFFFFF}

.av{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:#fff;background:linear-gradient(140deg,hsl(var(--h) 52% 46%),hsl(calc(var(--h) + 30) 52% 34%))}
.av.co{border-radius:8px}
.av.lg{width:50px;height:50px;border-radius:14px;font-size:17px}
.av.xs{width:22px;height:22px;border-radius:7px;font-size:9.5px}
.score{--v:50;width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;background:radial-gradient(closest-side,var(--solid) 74%,transparent 76%),conic-gradient(var(--sc) calc(var(--v)*1%),var(--line) 0)}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:11px;padding:9px 2px;border-top:1px solid var(--line);text-decoration:none}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.row:hover{background:var(--glass)}

.ih{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-radius:12px;background:var(--glass-2);border:1px solid var(--acc);margin-bottom:8px;font-size:13px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--acc)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
td.ck,th.ck{width:34px;padding-right:0}
td.ck input,th.ck input{accent-color:var(--acc);width:15px;height:15px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--glass)}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who b{display:block;font-weight:600;white-space:nowrap}
.who small{color:var(--muted);font-size:12px;white-space:nowrap}
.link{color:var(--acc);text-decoration:none;font-weight:600}
.link:hover{text-decoration:underline}

.sumbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border-radius:14px;border:1px solid var(--line);background:var(--glass);overflow:hidden}
.sumbar div{padding:10px 14px;border-left:1px solid var(--line);min-width:0}
.sumbar div:first-child{border-left:0}
.sumbar small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.sumbar b{font-family:var(--f-mono);font-size:15px;font-weight:500}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;min-height:380px}
.col{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:var(--glass);border:1px solid var(--line);min-width:0}
.col.over{border-color:var(--acc);background:var(--glass-2)}
.col-h{display:flex;align-items:baseline;gap:8px;padding:2px 4px 2px}
.col-h b{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.col-f{margin-top:auto;padding:8px 4px 0;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.card{padding:11px 12px;border-radius:12px;background:var(--glass-2);border:1px solid var(--line);cursor:grab;display:flex;flex-direction:column;gap:6px;position:relative}
.card.dragging{opacity:.4}
.card .t{font-weight:600;font-size:13px;text-decoration:none}
.card .m{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:8px}
.card[data-pri]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--pc)}
.prob{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.prob i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc-2))}

/* record page */
.rec{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:12px;align-items:start}
.rec>*{min-width:0}
.rec-l,.rec-r{display:flex;flex-direction:column;gap:12px}
.rec-head{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.rec-name{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere}
.qa{display:flex;gap:6px;flex-wrap:wrap}
.qa button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font-size:11px;color:var(--muted);font-weight:600;padding:0}
.qa button span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:0;background:var(--action);color:#FFFFFF}
.qa button:hover span{background:var(--action-hover);color:#FFFFFF}
.props{display:flex;flex-direction:column;gap:2px}
.prop{display:flex;flex-direction:column;padding:6px 8px;border-radius:9px;border:1px solid transparent}
.prop:hover{background:var(--glass);border-color:var(--line)}
.prop label{font-size:11px;color:var(--muted);font-weight:600}
.prop input,.prop select{border:0;background:transparent;padding:1px 0;outline:none;font-weight:600;width:100%;font-size:13px}
.prop input:focus,.prop select:focus{border-bottom:1px solid var(--acc)}
.stagebar{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.stagebar button{flex:1;min-width:84px;border:0;background:var(--tab);font-size:11.5px;font-weight:600;padding:7px 8px;color:var(--muted);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%);border-radius:0}
.stagebar button.done{background:var(--action-done);color:#FFFFFF}
.stagebar button.cur{background:var(--action);color:#FFFFFF}
.composer-box{padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--glass);display:flex;flex-direction:column;gap:8px}
.tl{display:flex;flex-direction:column;gap:10px}
.tli{display:flex;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--glass)}
.tli .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--glass-2);color:var(--acc);flex:none}
.tli .b{flex:1;min-width:0}
.tli .tt{font-weight:600;font-size:13px}
.tli .bd{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px}
.tli .meta{font-size:11.5px;color:var(--faint);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.assoc{padding:12px 14px}
.assoc-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.assoc-h b{font-size:13px}
.ks-box{padding:14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 10%,transparent),var(--glass))}
.ks-box .out{font-size:13px;white-space:pre-wrap;margin-top:8px;color:var(--fg)}

/* inbox */
.inbox{display:grid;grid-template-columns:220px minmax(0,340px) minmax(0,1fr);gap:12px;min-height:560px}
.inbox>*{min-width:0}
.mlist{display:flex;flex-direction:column;overflow:auto;max-height:72vh}
.mi{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;border-left:3px solid transparent;background:none;border-top:0;border-right:0;width:100%}
.mi:hover{background:var(--glass)}
.mi.sel{background:var(--glass-2);border-left-color:var(--acc)}
.mi.unread .t{font-weight:700}
.mi .unread-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);margin-top:6px;flex:none}
.mi .grow{flex:1;min-width:0}
.mi .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mi .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--glass);font-size:12.5px}
.acct .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder{display:flex;justify-content:space-between;padding:7px 10px;border-radius:9px;border:0;background:var(--tab);width:100%;text-align:left;font-weight:600;font-size:13px;color:var(--muted)}
.folder[aria-pressed="true"]{background:var(--action);color:#FFFFFF}
.mail-body{white-space:pre-wrap;font-size:13.5px;line-height:1.6;overflow-wrap:anywhere}

/* calendar */
.cal{display:grid;grid-template-columns:44px repeat(7,minmax(96px,1fr));position:relative;min-width:760px}
.cal .hd{position:sticky;top:0;padding:8px 6px;text-align:center;font-size:12px;font-weight:700;border-bottom:1px solid var(--line);background:var(--solid);z-index:2}
.cal .hd.today{color:var(--acc)}
.cal .hr{height:48px;border-top:1px solid var(--line);font-size:10.5px;color:var(--faint);font-family:var(--f-mono);padding:2px 4px 0 0;text-align:right}
.cal .daycol{position:relative;border-left:1px solid var(--line)}
.cal .slot{height:48px;border-top:1px solid var(--line)}

(() => {
"use strict";
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY = 864e5, HR = 36e5, MIN = 6e4;
const T0 = (() => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); })();
const at = (days, h = 9, m = 0) => T0 + days*DAY + h*HR + m*MIN;
const ago = (days, h = 0) => Date.now() - days*DAY - h*HR;
const money = (n, c) => { n = Number(n)||0; if (c) { const a = Math.abs(n); if (a >= 1e6) return "$"+(n/1e6).toFixed(a>=1e7?1:2).replace(/\.?0+$/,"")+"M"; if (a >= 1e3) return "$"+Math.round(n/1e3)+"K"; } return "$"+Math.round(n).toLocaleString("en-US"); };
const num = n => Number(n||0).toLocaleString("en-US");
const pct = n => (Number(n)||0).toFixed(1)+"%";
const hueOf = s => { let h = 0; for (const ch of String(s)) h = (h*31 + ch.charCodeAt(0)) % 997; return 150 + h % 165; };
const initials = s => String(s).replace(/[^A-Za-z0-9 ]/g," ").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase() || "?";
const fmtD = ts => new Date(ts).toLocaleDateString("en-US",{month:"short",day:"numeric"});
const fmtDY = ts => new Date(ts).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const fmtT = ts => new Date(ts).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
const daysTo = ts => Math.round((new Date(ts).setHours(0,0,0,0) - T0)/DAY);
const rel = ts => { const d = Date.now() - ts, a = Math.abs(d); let s; if (a < MIN) return "just now"; if (a < HR) s = Math.round(a/MIN)+" min"; else if (a < DAY) s = Math.round(a/HR)+" hr"; else { const n = Math.round(a/DAY); s = n+" day"+(n>1?"s":""); } return d < 0 ? "in "+s : s+" ago"; };
const toInputDate = ts => { const d = new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fromInputDate = (v, h = 9) => { const [y,m,d] = String(v).split("-").map(Number); return y ? new Date(y, m-1, d, h).getTime() : Date.now(); };
const uid = () => Math.random().toString(36).slice(2,9);
const IC = {
  overview:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM13 3v6h8V3zM3 21h8v-6H3z"/>',
  contacts:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>',

  deals:'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',

  if (r.status === 401) { location.href = "/login.html"; throw new Error("Signed out"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || `Request failed (${r.status})`), {status:r.status});
  return j;
}
/* Diff-based sync: the server's last known JSON per record; save() sends only what changed. */
const snap = new Map();
const skey = (u,t,id) => u+"|"+t+"|"+id;
function rememberAll(){ snap.clear(); for (const u of ["res","com"]) for (const t of COLLS) for (const r of state.data[u][t]) snap.set(skey(u,t,r.id), JSON.stringify(r)); }
let saveT, syncing = false, pendingSync = false;
const save = () => { try { localStorage.setItem("atrium-seg", state.seg); } catch(e) {} clearTimeout(saveT); saveT = setTimeout(flush, 400); };
async function flush(){
  if (syncing) { pendingSync = true; return; }
  const changes = {}, sent = [], seen = new Set(); let n = 0;
  const bucket = (u,t) => ((changes[u] ??= {})[t] ??= {upsert:[], delete:[]});
  for (const u of ["res","com"]) for (const t of COLLS) for (const r of state.data[u][t]) {
    const k = skey(u,t,r.id); seen.add(k); const js = JSON.stringify(r);
    if (snap.get(k) !== js) { bucket(u,t).upsert.push(JSON.parse(js)); sent.push([k, js]); n++; }
  }
  for (const k of [...snap.keys()]) if (!seen.has(k)) { const [u,t,id] = k.split("|"); bucket(u,t).delete.push(id); sent.push([k, null]); n++; }
  if (!n) return;
  syncing = true;
  try { await api("POST", "/api/sync", {changes}); for (const [k, js] of sent) js === null ? snap.delete(k) : snap.set(k, js); }
  catch(e) { if (e.message !== "Signed out") toast("Couldn't save changes: " + e.message); }
  finally { syncing = false; if (pendingSync) { pendingSync = false; flush(); } }
}
async function flushNow(){ clearTimeout(saveT); await flush(); }

let cursor = 0;
function mergeRecords(recs){
  let touched = false;
  for (const rec of recs) {
    const u = rec.unit, t = rec.type; if (!state.data[u]?.[t]) continue;
    const arr = state.data[u][t], k = skey(u,t,rec.id), i = arr.findIndex(x => x.id === rec.id);
    if (rec.deleted) { if (i >= 0) { arr.splice(i,1); touched = true; } snap.delete(k); continue; }
    const js = JSON.stringify(rec.data);
    if (i >= 0 && JSON.stringify(arr[i]) === js) { snap.set(k, js); continue; }
    if (i >= 0) arr[i] = rec.data; else arr.unshift(rec.data);
    snap.set(k, js); touched = true;
  }
  return touched;
}
async function poll(){

    const fresh = j.records.filter(r => r.type === "mail" && !r.deleted && r.data.folder === "inbox" && !r.data.read && !snap.has(skey(r.unit, r.type, r.id)));

}

function dealMetrics(list = D().deals){
  const open = list.filter(isOpenDeal), won = list.filter(d => d.stage === "won");
  const total = list.filter(d => d.stage !== "lost").reduce((a,d) => a+d.amount, 0);
  const weighted = open.reduce((a,d) => a + d.amount*stageOf(d).p/100, 0);
  const openAmt = open.reduce((a,d) => a+d.amount, 0);
  const wonAmt = won.reduce((a,d) => a+d.amount, 0);
  const newM = list.filter(d => Date.now()-d.created < 30*DAY).length;
  const avgAge = open.length ? Math.round(open.reduce((a,d) => a + (Date.now()-d.created)/DAY, 0)/open.length) : 0;
  return {open, won, total, weighted, openAmt, wonAmt, newM, avgAge};
}

function areaChart(vals, prev, labels){

function bindTable(v, key, collection, allIds){

const STATUS_ORDER = ["Active","Coming soon","For lease","For sale","Pending","Under offer","Under LOI","Under contract","Sold","Leased","Off-market"];
function inventoryPanel(){
  const ps = D().properties, com = isCom();
  const by = (...st) => ps.filter(p => st.includes(p.status));
  const avg = a => a.length ? sum(a) / a.length : 0;
  let tiles;
  if (!com) {
    const forSale = ps.filter(p => p.kind !== "Rental"), active = forSale.filter(p => ["Active","Coming soon"].includes(p.status));
    const pending = forSale.filter(p => ["Pending","Under offer"].includes(p.status)), sold = forSale.filter(p => p.status === "Sold");
    tiles = [
      ["Active listings", num(active.length), `${by("Coming soon").length} coming soon`],
      ["Avg list price", active.length ? money(avg(active.map(p => p.price)), 1) : "—", "active, for sale"],
      ["Avg price / sq ft", active.some(p => p.sqft) ? "$" + num(Math.round(avg(active.filter(p => p.sqft).map(p => p.price / p.sqft)))) : "—", "active listings"],
      ["Avg days on market", active.length ? num(Math.round(avg(active.map(p => p.dom || 0)))) : "—", "active listings"],
      ["Pending", num(pending.length), money(sum(pending.map(p => p.price)), 1) + " volume"],
      ["Sold & leased", num(sold.length + by("Leased").length), money(sum(sold.map(p => p.price)), 1) + " sold volume"]
    ];
  } else {
    const avail = by("For lease","For sale"), leased = by("Leased"), lease = ps.filter(p => p.rate), sale = ps.filter(p => p.cap);
    const occBase = ps.filter(p => p.sf && p.kind !== "Land" && p.status !== "Off-market");
    const occ = sum(occBase.map(p => p.sf)) ? sum(occBase.map(p => p.sf * (p.occ || 0))) / sum(occBase.map(p => p.sf)) : 0;
    const uc = by("Under contract","Under LOI","Pending","Under offer");
    tiles = [
      ["Available SF", num(sum(avail.map(p => p.sf))), `${avail.length} listings`],
      ["Leased SF", num(sum(leased.map(p => p.sf))), `${leased.length} propert${leased.length === 1 ? "y" : "ies"}`],
      ["Avg asking rent", lease.length ? "$" + avg(lease.map(p => p.rate)).toFixed(2) : "—", "per SF / year"],
      ["Avg cap rate", sale.length ? avg(sale.map(p => p.cap)).toFixed(2) + "%" : "—", `${sale.length} investment sale${sale.length === 1 ? "" : "s"}`],
      ["Occupancy", occBase.length ? Math.round(occ) + "%" : "—", "weighted by SF"],
      ["Under contract / LOI", num(uc.length), money(sum(uc.map(p => p.price || 0)), 1) + " volume"]
    ];
  }
  const rows = [...ps].sort((a,b) => (STATUS_ORDER.indexOf(a.status) + 99) % 99 - (STATUS_ORDER.indexOf(b.status) + 99) % 99);
  const size = p => com ? `${num(p.sf)} SF` : p.kind === "Rental" ? `${p.beds} bd · ${num(p.sqft)} sq ft` : `${p.beds} bd · ${p.baths} ba · ${num(p.sqft)} sq ft`;
  const price = p => com ? (p.price ? money(p.price, 1) + (p.cap ? ` · ${p.cap}% cap` : "") : p.rate ? `$${p.rate}/SF/yr` : "—") : p.kind === "Rental" ? money(p.price) + "/mo" : money(p.price);
  return `<section class="glass panel"><div class="panel-h"><h2>${S().label} inventory</h2><span class="sub">${ps.length} propert${ps.length === 1 ? "y" : "ies"}</span><a class="right btn sm" href="#properties">All listings</a></div>
    <div class="inv-tiles">${tiles.map(t => `<div class="inv"><small>${t[0]}</small><b class="num">${t[1]}</b><span>${t[2]}</span></div>`).join("")}</div>
    ${rows.length ? `<div class="tablewrap" style="margin-top:12px"><table style="min-width:620px"><thead><tr><th>Property</th><th>Type</th><th>${com ? "Size" : "Beds · baths · size"}</th><th>${com ? "Price / rate" : "Price"}</th><th>Status</th></tr></thead><tbody>
      ${rows.map(p => `<tr data-href="properties"><td><b>${esc(p.name)}</b><div class="note">${esc(p.area)}</div></td><td>${esc(p.kind)}${com && p.cls && p.cls !== "—" ? " · Class " + esc(p.cls) : ""}</td><td class="num">${size(p)}</td><td class="num" style="color:#FFFFFF">${price(p)}</td><td>${statusChip(p.status)}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">No properties yet. Add listings, sync your MLS, or import from CoStar.</div>`}</section>`;
}
function insights(){
  const d = D(), out = [];
  const urgent = d.tickets.filter(t => t.status!=="closed" && t.priority==="Urgent");
  urgent.forEach(t => out.push({tag:"Urgent",c:"bad",text:`Ticket <a class="link" href="#ticket-${t.id}">${esc(t.subject)}</a> is open ${rel(t.created)}.`}));
  if (isCom()) {
    d.companies.filter(c => c.expiry && daysTo(c.expiry) < 120).sort((a,b)=>a.expiry-b.expiry).slice(0,2).forEach(c => out.push({tag:"Renewal",c:"warn",text:`<a class="link" href="#company-${c.id}">${esc(c.name)}</a> lease expires in ${daysTo(c.expiry)} days.`}));
  } else {
    d.contacts.filter(c => c.score>=60 && Date.now()-c.lastAct > 6*DAY).slice(0,2).forEach(c => out.push({tag:"Re-engage",c:"warn",text:`<a class="link" href="#contact-${c.id}">${esc(cname(c))}</a> scores ${c.score} but was last touched ${rel(c.lastAct)}.`}));
  }
  const closing = d.deals.filter(x => isOpenDeal(x) && daysTo(x.close) <= 21 && daysTo(x.close) >= 0);
  if (closing.length) out.push({tag:"Closing",c:"good",text:`${closing.length} deal${closing.length>1?"s":""} worth ${money(closing.reduce((a,x)=>a+x.amount,0),1)} should close in 3 weeks.`});
  const unread = d.mail.filter(m => m.folder==="inbox" && !m.read).length;
  if (unread) out.push({tag:"Inbox",c:"info",text:`${unread} unread email${unread>1?"s":""} from contacts, already logged to their records.`});
  return out.slice(0,5);
}

function bindBoard(v, kind, onDrop){
  const board = $("#board", v); if (!board) return; let dragId = null;
  $$(".card", board).forEach(c => {
    c.addEventListener("dragstart", e => { dragId = c.dataset[kind]; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", dragId); } catch(_){} });
    c.addEventListener("dragend", () => c.classList.remove("dragging"));
    c.addEventListener("click", e => { if (e.target.closest("a")) return; location.hash = kind+"-"+c.dataset[kind]; });
    c.addEventListener("keydown", e => { if (e.key === "Enter") location.hash = kind+"-"+c.dataset[kind]; });
  });
  $$(".col", board).forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", e => { e.preventDefault(); col.classList.remove("over"); if (dragId) onDrop(dragId, col.dataset.stage); });
  });
}
function moveDeal(id, stage, silent){
  const x = deal(id); if (!x || x.stage === stage) return false;
  const s = pipeOf(x.pipe).stages.find(s => s.k === stage); if (!s) return false;
  x.stage = stage;
  addAct("stage", `Deal moved to ${s.n}`, x.name, {deal:[x.id], contact:[...x.contacts], company:x.company?[x.company]:[]});
  if (stage === "won") x.close = Date.now();
  save(); if (!silent) { toast(`${x.name} → ${s.n}`); render(); }
  return true;
}

function bindRecord(v, type, id){
  const o = recordObj(type, id);
  $$("[data-rectab]", v).forEach(b => { b.setAttribute("aria-selected", String(b.dataset.rectab === ui.recTab)); b.onclick = () => { ui.recTab = b.dataset.rectab; render(); }; });
  $$("[data-prop]", v).forEach(el => el.addEventListener("change", () => {
    const k = el.dataset.prop; let val = el.value;
    if (el.type === "number") val = Number(val)||0;
    if (el.type === "date") val = fromInputDate(val);
    if (k === "company" || k === "prop") val = val || null;
    if (type === "deal" && k === "stage") { moveDeal(id, val); return; }
    if (type === "deal" && k === "pipe") { o.pipe = val; o.stage = pipeOf(val).stages[0].k; }
    else if (type === "ticket" && k === "status") { moveTicket(id, val); return; }
    else o[k] = val;
    addAct("note", `Property updated: ${el.closest(".prop").querySelector("label").textContent}`, String(el.tagName==="SELECT"?el.options[el.selectedIndex].text:el.value), {[type]:[id]}, {system:true});
    save(); toast("Saved"); render();
  }));
  $$("[data-compose]", v).forEach(b => b.onclick = () => { ui.composer = b.dataset.compose; render(); $("#cmpBody, #cmpSubj")?.focus(); });
  $("#cmpClose", v)?.addEventListener("click", () => { ui.composer = null; render(); });
  $("#cmpAI", v)?.addEventListener("click", async e => {
    const btn = e.currentTarget; btn.disabled = true; btn.innerHTML = svg("ks")+"Drafting…";
    const ctx = recordContext(type, id);
    const out = await ks(`You are Keystone, the AI assistant in a ${S().label.toLowerCase()} real-estate CRM. Write a short, warm, specific email from ${ME.name} for this record. Reply with only JSON {"subject": string, "body": string}. Body under 120 words, plain text, signed "${ME.first}".\n\nRecord:\n${ctx}`, {json:true, tier:"quick"});
    const draft = out && out.subject ? out : localDraft(type, id);
    $("#cmpSubj").value = draft.subject; $("#cmpBody").value = draft.body; btn.disabled = false; btn.innerHTML = svg("ks")+"Draft with Keystone";
  });
  $("#cmpSave", v)?.addEventListener("click", async () => {
    const c = ui.composer, body = $("#cmpBody")?.value?.trim() || "", subj = $("#cmpSubj")?.value?.trim() || "";
    const refs = refsFor(type, id);
    if (c === "note") { if (!body) return toast("Write a note first"); addAct("note", "Note", body, refs); }
    if (c === "email") { const to = $("#cmpTo").value.trim(); if (!to || !subj) return toast("Add a recipient and subject"); try { await sendMail(to, subj, body, refs); } catch(e) { return toast(e.message); } }
    if (c === "call") addAct("call", `${$("#cmpDir").value} call`, body, refs, {outcome:$("#cmpOut").value});
    if (c === "task") { if (!subj) return toast("Give the task a title"); const t = {id:uid(), title:subj, due:fromInputDate($("#cmpDue").value, 9), kind:$("#cmpKind").value, ref:{[type]:id}, done:false, owner:ME.name}; D().tasks.push(t); addAct("task", "Task created: "+subj, "Due "+fmtDY(t.due), refs); }
    if (c === "meeting") { if (!subj) return toast("Give the meeting a title"); const [hh,mm] = ($("#cmpTime").value||"10:00").split(":").map(Number); const start = fromInputDate($("#cmpDue").value, 0) + hh*HR + mm*MIN; try { await createEvent({title:subj, start, dur:Number($("#cmpDur").value)||45, loc:$("#cmpLoc").value, contact:type==="contact"?id:(refs.contact[0]||null)}, refs); } catch(e) { return toast(e.message); } }
    ui.composer = null; save(); toast({note:"Note saved",email:"Email sent and logged",call:"Call logged",task:"Task created",meeting:"Meeting scheduled"}[c]); render();
  });
  $("#ksRec", v)?.addEventListener("click", async e => {
    const out = $("#ksOut"), btn = e.currentTarget; btn.disabled = true; out.innerHTML = '<span class="thinking">Keystone is reading this record…</span>';
    const ctx = recordContext(type, id);
    const text = await ks(`You are Keystone, the AI assistant in a ${S().label.toLowerCase()} real-estate CRM used by broker ${ME.name}. ${out.dataset.prompt}\nBe concise: at most 6 short lines, plain text, no headings. Use only facts in the record.\n\nRecord:\n${ctx}`, {onText:t => { out.textContent = t; }});
    out.textContent = text || localSummary(type, id); btn.disabled = false;
  });
  $$("[data-setstage]", v).forEach(b => b.onclick = () => moveDeal(id, b.dataset.setstage));
  $$("[data-settstatus]", v).forEach(b => b.onclick = () => moveTicket(id, b.dataset.settstatus));
  $$("[data-addassoc]", v).forEach(b => b.onclick = () => addAssociation(type, id, b.dataset.addassoc));
  $("#dsSend", v)?.addEventListener("click", () => openDocuSign(id));
  $("#delRec", v).onclick = () => confirmBox(`Delete this ${type}?`, "Associated activity stays on the other records.", () => {
    const k = RECORD[type]; D()[k] = D()[k].filter(r => r.id !== id); save(); toast(`${type[0].toUpperCase()+type.slice(1)} deleted`); location.hash = k;
  });
}
function refsFor(type, id){
  const o = recordObj(type, id), r = {contact:[],company:[],deal:[],ticket:[]};
  r[type].push(id);
  if (type === "deal") { r.contact.push(...o.contacts); if (o.company) r.company.push(o.company); }
  if (type === "ticket") { if (o.contact) r.contact.push(o.contact); if (o.company) r.company.push(o.company); }
  if (type === "contact" && o.company) r.company.push(o.company);
  return r;
}
function addAssociation(type, id, target){
  const d = D(), o = recordObj(type, id);
  const opts = {contact:d.contacts.map(c=>[c.id,cname(c)]), company:d.companies.map(c=>[c.id,c.name]), deal:d.deals.map(x=>[x.id,x.name]), ticket:d.tickets.map(t=>[t.id,t.subject])}[target];
  modal(`Associate a ${target}`, [{k:"target",l:target[0].toUpperCase()+target.slice(1),t:"select",o:opts,full:true}], vals => {
    const t = vals.target; if (!t) return;
    if (type==="contact"&&target==="company") o.company = t;
    else if (type==="contact"&&target==="deal") { const x=deal(t); if (!x.contacts.includes(id)) x.contacts.push(id); }
    else if (type==="contact"&&target==="ticket") ticket(t).contact = id;
    else if (type==="company"&&target==="contact") contact(t).company = id;
    else if (type==="company"&&target==="deal") deal(t).company = id;
    else if (type==="company"&&target==="ticket") ticket(t).company = id;
    else if (type==="deal"&&target==="contact") { if (!o.contacts.includes(t)) o.contacts.push(t); }
    else if (type==="deal"&&target==="company") o.company = t;
    else if (type==="deal"&&target==="ticket") { const tk = ticket(t); tk.contact = tk.contact || o.contacts[0]; }
    else if (type==="ticket"&&target==="contact") o.contact = t;
    else if (type==="ticket"&&target==="company") o.company = t;
    save(); toast("Association added");
  });
}

function recordContext(type, id){
  const d = D(), o = recordObj(type, id);
  const acts = timelineFor(type, id).slice(0, 10).map(a => `- ${fmtDY(a.ts)} ${a.kind}: ${a.title}${a.body?" — "+a.body.slice(0,200):""}`).join("\n");

  if (type==="contact") base = JSON.stringify({name:cname(o),email:o.email,title:o.title,company:company(o.company)?.name,lifecycle:o.lifecycle,lead_status:o.status,type:o.type,budget:o.budget,area_or_requirement:o.area,score:o.score,last_touched:rel(o.lastAct),deals:d.deals.filter(x=>x.contacts.includes(id)).map(x=>({name:x.name,stage:stageOf(x).n,amount:x.amount,close:fmtDY(x.close)})),tickets:d.tickets.filter(t=>t.contact===id).map(t=>({subject:t.subject,status:tstage(t.status).n,priority:t.priority}))});
  if (type==="company") base = JSON.stringify({name:o.name,industry:o.industry,city:o.city,lifecycle:o.lifecycle,lease_expiry:o.expiry?fmtDY(o.expiry):null,occupied_sf:o.sf,contacts:d.contacts.filter(c=>c.company===id).map(c=>cname(c)+" ("+c.title+")"),deals:d.deals.filter(x=>x.company===id).map(x=>({name:x.name,stage:stageOf(x).n,amount:x.amount})),tickets:d.tickets.filter(t=>t.company===id).map(t=>({subject:t.subject,status:tstage(t.status).n}))});
  if (type==="deal") base = JSON.stringify({name:o.name,pipeline:pipeOf(o.pipe).n,stage:stageOf(o).n,probability:stageOf(o).p,amount:o.amount,close:fmtDY(o.close),days_to_close:daysTo(o.close),priority:o.priority,owner:o.owner,contacts:o.contacts.map(c=>cname(contact(c))),company:company(o.company)?.name,property:byId(d.properties,o.prop)?.name,age_days:Math.round((Date.now()-o.created)/DAY)});
  if (type==="ticket") base = JSON.stringify({subject:o.subject,description:o.desc,status:tstage(o.status).n,priority:o.priority,category:o.cat,contact:cname(contact(o.contact)),contact_email:contact(o.contact)?.email,company:company(o.company)?.name,opened:rel(o.created),source:o.source});
  return base + "\nRecent activity:\n" + (acts || "none");
}
function localSummary(type, id){
  const o = recordObj(type, id), d = D();

  if (type==="company") { const ds = d.deals.filter(x=>x.company===id&&isOpenDeal(x)); return `${o.name} (${o.industry}) has ${d.contacts.filter(c=>c.company===id).length} contacts and ${ds.length} open deal${ds.length===1?"":"s"} worth ${money(ds.reduce((a,x)=>a+x.amount,0),1)}.${o.expiry?`\nLease expires ${fmtDY(o.expiry)} (${daysTo(o.expiry)} days).`:""}\nNext step: confirm decision makers and timeline with the primary contact.`; }
  if (type==="deal") { const dd = daysTo(o.close); return `${o.name} is in ${stageOf(o).n} (${stageOf(o).p}%), ${money(o.amount)}.\nClose date ${fmtDY(o.close)} — ${dd<0?"past due, update it":dd+" days away"}.\nNext step: ${stageOf(o).p>=75?"line up closing documents and confirm financing.":"book the next meeting and agree on a decision date."}`; }

}
function localDraft(type, id){
  const o = recordObj(type, id);
  const c = type==="contact" ? o : type==="deal" ? contact(o.contacts[0]) : type==="ticket" ? contact(o.contact) : D().contacts.find(x=>x.company===id);

  const email = Object.entries(vals).find(([k]) => /email/.test(k))?.[1] || "";
  const nameVal = vals["first name"] || vals["full name"] || vals["name"] || "Web";
  const last = vals["last name"] || (nameVal.split(" ").slice(1).join(" ")) || "Visitor";
  let c = email && matchContactByEmail(email);
  if (!c) { c = {id:uid(), first:nameVal.split(" ")[0], last, email:email||"—", phone:vals["phone"]||"—", title:"", company:null, lifecycle:f.lifecycle, status:"New", owner:S().owners[0], source:"Website", score:58, lastAct:Date.now(), created:Date.now(), type:S().types[0], budget:Number(vals["budget"])||0, area:vals["property address"]||""}; D().contacts.unshift(c); }
  f.submissions++; f.views++;

  addAct("form", `Submitted form: ${f.name}`, Object.entries(vals).map(([k,v])=>`${k}: ${v}`).join("\n"), {contact:[c.id]});
  if (f.notify) D().tasks.push({id:uid(), title:`Follow up on ${f.name} from ${cname(c)}`, due:at(0,17), kind:"Call", ref:{contact:c.id}, done:false, owner:c.owner});
  save(); toast(`Submission saved. ${cname(c)} is in Contacts.`); render();
}

      <div>${Array.from({length:H1-H0},(_,i)=>`<div class="hr">${(H0+i)%12||12}${H0+i<12?"a":"p"}</div>`).join("")}</div>

/* ================= import CSV ================= */
function bindImport(v){
  $$("[data-import]", v).forEach(b => b.onclick = () => {
    const kind = b.dataset.import;
    layer.innerHTML = `<div class="scrim" data-close></div><div class="modal"><div class="box glass"><div style="display:flex;align-items:center"><b class="h2" style="flex:1">Import ${kind}</b><button class="iconbtn" data-close aria-label="Close">${svg("x")}</button></div>
      <p class="sub" style="margin:0">Upload a CSV with a header row. Recognized columns: ${kind==="contacts"?"first name, last name, email, phone, job title, company":"name, domain, industry, city, employees"}.</p>
      <label class="btn" for="csvIn" style="align-self:flex-start">${svg("upload")}Choose CSV file</label><input id="csvIn" type="file" accept=".csv,text/csv" hidden><div id="csvOut" class="sub"></div></div></div>`;
    $$("[data-close]", layer).forEach(e => e.onclick = closeLayer);
    $("#csvIn").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { const n = importCSV(kind, String(r.result)); $("#csvOut").textContent = n ? `Imported ${n} ${kind}.` : "No rows found. Check that the first row has column names."; if (n) { save(); setTimeout(() => { closeLayer(); render(); }, 900); } }; r.readAsText(f); };
  });
}
function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"' && text[i+1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ",") { row.push(cur); cur = ""; } else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; } else cur += ch; }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function importCSV(kind, text){
  const rows = parseCSV(text); if (rows.length < 2) return 0;
  const hdr = rows[0].map(h => h.trim().toLowerCase()), col = (...names) => hdr.findIndex(h => names.includes(h));
  let n = 0;
  rows.slice(1).forEach(r => {

const aiOn = () => !!state.features?.ai;
async function ks(prompt, {json = false, onText} = {}){
  if (!aiOn()) return null;
  try {
    const j = await api("POST", "/api/ai/messages", {messages:[{role:"user", content: json ? prompt + "\n\nRespond with only the JSON value, no other text." : prompt}], max_tokens:1500});
    const text = (j.content || []).filter(b => b.type === "text").map(b => b.text).join("").trim();
    if (onText) onText(text);
    if (!json) return text || null;
    const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/);
    let raw = fence ? fence[1] : text;
    const starts = ["{","["].map(c => raw.indexOf(c)).filter(i => i >= 0);
    if (starts.length) raw = raw.slice(Math.min(...starts), Math.max(raw.lastIndexOf("}"), raw.lastIndexOf("]")) + 1);
    try { return JSON.parse(raw); } catch(e) { return null; }
  } catch(e) { if (e.status === 429) toast("Keystone is busy. Try again in a minute."); return null; }
}

function chatLink(hash, label){ chatLog.splice(chatLog.length-1, 0, {r:"tool", t:`<a class="link" href="#${hash}">${esc(label)} →</a>`, html:true}); paintChat(); }
async function ask(text){
  if (busy) return;
  if (!$("#chat")) openKS();
  chatLog.push({r:"user", t:text});
  const bot = {r:"bot", t:'<span class="thinking">Thinking…</span>', html:true}; chatLog.push(bot);
  busy = true; stopFlag = false; paintChat();
  if (!aiOn()) { await new Promise(r => setTimeout(r, 300)); bot.t = await localAnswer(text); bot.html = false; busy = false; paintChat(); return; }
  const tools = TOOLS();
  const toolDefs = tools.map(t => ({name:t.name, description:t.description, input_schema:t.inputSchema || {type:"object", properties:{}}}));
  turns.push({role:"user", content:text});
  let msgs = turns.slice(-12);
  if (msgs[0]?.role !== "user") msgs = msgs.slice(1);
  try {
    let said = "";
    for (let round = 0; round < 6; round++) {
      const j = await api("POST", "/api/ai/messages", {system:RULES(), messages:msgs, tools:toolDefs, max_tokens:2000});
      const textOut = (j.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
      if (textOut) { said = textOut; bot.t = textOut; bot.html = false; paintChat(); }
      const uses = (j.content || []).filter(b => b.type === "tool_use");
      msgs = [...msgs, {role:"assistant", content:j.content}];
      if (j.stop_reason !== "tool_use" || !uses.length || stopFlag) break;
      const results = [];
      for (const u of uses) {
        const t = tools.find(x => x.name === u.name); let out, err = false;
        try { out = t ? await t.execute(u.input || {}, {}) : {error:"Unknown tool"}; } catch(e) { out = {error:e.message}; err = true; }
        results.push({type:"tool_result", tool_use_id:u.id, content:JSON.stringify(out ?? {ok:true}).slice(0, 30000), ...(err ? {is_error:true} : {})});
      }
      msgs.push({role:"user", content:results});
      if (!textOut) { bot.t = '<span class="thinking">Working…</span>'; bot.html = true; paintChat(); }
    }
    bot.t = said || (stopFlag ? "Stopped." : "Done."); bot.html = false;
    turns.push({role:"assistant", content:bot.t});
  } catch(e) {
    turns.pop();
    bot.t = e.status === 503 ? await localAnswer(text) : "Keystone couldn't finish that: " + e.message; bot.html = false;
  } finally { busy = false; paintChat(); save(); }
}
async function localAnswer(q){
  const d = D(), s = q.toLowerCase(), m = dealMetrics();
  const c = findContact(q.replace(/^(draft|write|reply|summarize|create|schedule|call|email)\b/i,""));
  if (/ticket/.test(s) && /triage|urgent|open|which/.test(s)) { const open = d.tickets.filter(t=>t.status!=="closed").sort((a,b)=>PRIORITY.indexOf(b.priority)-PRIORITY.indexOf(a.priority)); return "Open tickets, most urgent first:\n"+open.map(t=>`• [${t.priority}] ${t.subject} — ${tstage(t.status).n}, ${cname(contact(t.contact))||"no contact"}`).join("\n"); }
  if (/create .*ticket/.test(s)) { const t = {id:uid(), subject:q.replace(/.*ticket (for|about)?/i,"").trim()||"New ticket", desc:"", status:"new", priority:"Medium", cat:S().tcats[0], contact:c?.id||null, company:c?.company||null, owner:ME.name, source:"Keystone", created:Date.now()}; d.tickets.unshift(t); save(); render(); return `Created ticket “${t.subject}”${c?` for ${cname(c)}`:""}.`; }
  if (/create .*deal/.test(s) && c) { const amt = Number((q.match(/\$?([\d.,]+)\s*(k|m)?/i)||[])[1]?.replace(/,/g,"")) * ({k:1e3,m:1e6}[(q.match(/\$?[\d.,]+\s*(k|m)/i)||[])[1]?.toLowerCase()]||1) || 0; const pipe = pipeOf(ui.pipe[state.seg]); const x = {id:uid(), name:`${c.last} – new deal`, pipe:pipe.k, stage:pipe.stages[0].k, amount:amt, close:at(45), owner:ME.name, contacts:[c.id], company:c.company, prop:null, created:Date.now(), priority:"Medium", dtype:"New business"}; d.deals.unshift(x); save(); render(); return `Created deal “${x.name}” in ${pipe.n} at ${money(amt)}.`; }
  if (/move/.test(s)) { const x = findDeal(q.replace(/move|to .*/gi,"").trim()) || (c && d.deals.find(y=>y.contacts.includes(c.id))); const st = x && pipeOf(x.pipe).stages.find(z => s.includes(z.n.toLowerCase())); if (x && st) { moveDeal(x.id, st.k); return `Moved ${x.name} to ${st.n}.`; } }
  if (/schedule|meeting|call with/.test(s) && c) { const hm = s.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/); let h = hm ? Number(hm[1])%12 + (hm[3]==="pm"?12:0) : 10; const e = await createEvent({title:`Call with ${cname(c)}`, start:at(/tomorrow/.test(s)?1:0, h, hm?.[2]?Number(hm[2]):0), dur:30, loc:"Phone", contact:c.id}); render(); return `Scheduled “${e.title}” for ${fmtD(e.start)} at ${fmtT(e.start)}${calOn()?" and sent the invite":""}.`; }
  if (/reply|draft|email to|follow/.test(s) && c) { const m2 = d.mail.find(x => x.contact === c.id && x.folder==="inbox"); const dr = localDraft("contact", c.id); return m2 ? `Re: ${m2.subject}\n\nHi ${c.first},\n\nThanks for your note. I'll get back to you today with next steps. Would a quick call tomorrow work?\n\nBest,\n${ME.first}` : `Subject: ${dr.subject}\n\n${dr.body}`; }
  if (/landing page/.test(s)) { const p = {id:uid(), name:"New landing page", slug:"new-page", status:"Draft", campaign:null, template:TEMPLATES[state.seg][0], headline:isCom()?"Space that works as hard as you do":"Find your next home", sub:"Tell us what you need and we'll send matching options within a day.", bullets:["Hand-picked options","Local market expertise","No obligation"], cta:"Get options", form:d.forms[0]?.id, views:0, submissions:0, hue:190}; d.pages.unshift(p); save(); return `Drafted a landing page from a template. Open Landing pages to edit it.`; }
  if (/marketing email|write an? .*email/.test(s)) return `Open Marketing email → Create email, then use “Write with Keystone” to draft the content from a brief.`;
  if (/expir|renew/.test(s) && isCom()) return "Leases expiring soonest:\n"+d.companies.filter(x=>x.expiry).sort((a,b)=>a.expiry-b.expiry).map(x=>`• ${x.name}: ${fmtDY(x.expiry)} (${daysTo(x.expiry)} days), ${num(x.sf)} SF`).join("\n");
  if (/risk|slip/.test(s)) return "Deals to watch:\n"+m.open.filter(x=>daysTo(x.close)<21||Date.now()-(contact(x.contacts[0])?.lastAct||0)>5*DAY).map(x=>`• ${x.name}: ${stageOf(x).n}, closes ${fmtD(x.close)}`).join("\n");
  if (/brief|today|first|morning/.test(s)) { const due = d.tasks.filter(t=>!t.done&&daysTo(t.due)<=0); const ev = d.events.filter(e=>daysTo(e.start)===0).sort((a,b)=>a.start-b.start); return `Pipeline: ${m.open.length} open deals, ${money(m.weighted,1)} weighted.\n\nCalendar: ${ev.map(e=>fmtT(e.start)+" "+e.title).join("; ")||"clear"}.\n\nDo first:\n${due.map(t=>"• "+t.title+(daysTo(t.due)<0?" (overdue)":"")).join("\n")}\n\n${insights().map(i=>"• "+i.text.replace(/<[^>]+>/g,"")).join("\n")}`; }
  if (/summar/.test(s)) { const co = findCompany(q); if (co) return localSummary("company", co.id); if (c) return localSummary("contact", c.id); }
  if (c) return localSummary("contact", c.id);
  const top = [...d.contacts].sort((a,b)=>b.score-a.score).slice(0,4);
  return `Top contacts right now:\n${top.map(x=>`• ${cname(x)} (${x.type}), score ${x.score}, last touched ${rel(x.lastAct)}`).join("\n")}\n\nTry: “create a deal for Priya at $525K”, “move Kestrel to Proposal / LOI”, “triage my tickets”, or “schedule a call with Marcus tomorrow at 2pm”.`;
}
