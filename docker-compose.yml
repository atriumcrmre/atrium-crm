services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: atrium
      POSTGRES_PASSWORD: atrium
      POSTGRES_DB: atrium
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atrium"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://atrium:atrium@db:5432/atrium
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
