<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · Atrium CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Same system as the app: deep-blue canvas, white 10% glass, solid ocean-blue controls. */
:root{color-scheme:dark;--fg:#FFFFFF;--muted:#ABC4FF;--line:rgba(255,255,255,.20);--glass:rgba(255,255,255,.10);--action:#0077B6;--action-hover:#0088CF;--tab:#1B2A52;--bad:#F44336}
*{box-sizing:border-box}
html{background:#0B132B}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#0B132B 0%,#1C2541 100%);color:var(--fg);font:15px/1.5 Manrope,system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
.card{width:min(420px,100%);padding:28px;border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(4,9,26,.45);display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--action);color:#FFFFFF}
h1{margin:0;font:700 24px "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tabs button{border:0;background:var(--tab);padding:9px;border-radius:9px;font:600 13px Manrope,sans-serif;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--action);color:#FFFFFF}
form{display:flex;flex-direction:column;gap:10px}
label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:5px}
input{font:inherit;color:#FFFFFF;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.08);outline:none}
input:focus{border-color:#ABC4FF}
.primary{padding:12px;border:0;border-radius:11px;background:var(--action);color:#FFFFFF;font:700 14px Manrope,sans-serif;cursor:pointer}
.primary:hover{background:var(--action-hover)}
.primary:disabled{opacity:.6}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.sso{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border-radius:11px;background:var(--action);color:#FFFFFF;text-decoration:none;font-weight:600;font-size:14px}
.sso:hover{background:var(--action-hover)}
.sso svg{background:#FFFFFF;border-radius:4px;padding:2px;box-sizing:content-box}
.sso[aria-disabled="true"]{opacity:.5;pointer-events:none}
.err{color:var(--bad);font-size:13px;min-height:1em;margin:0}
:focus-visible{outline:2px solid #ABC4FF;outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg></div><div><h1>Atrium</h1><p class="sub">Real estate CRM</p></div></div>
  <p class="sub" id="inviteNote" hidden></p>
  <div class="tabs" role="group" aria-label="Account"><button type="button" id="tSignin" aria-pressed="true">Sign in</button><button type="button" id="tSignup" aria-pressed="false">Create account</button></div>
  <a class="sso" id="google" href="/api/oauth/google/start?purpose=login"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</a>
  <a class="sso" id="microsoft" href="/api/oauth/microsoft/start?purpose=login"><svg width="16" height="16" viewBox="0 0 23 23" aria-hidden="true"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>Continue with Microsoft</a>
  <div class="or">or with email</div>
  <form id="f" novalidate>
    <label id="lName" hidden>Full name<input id="name" autocomplete="name"></label>
    <label id="lCompany" hidden>Brokerage name<input id="company" autocomplete="organization"></label>
    <label>Email<input id="email" type="email" autocomplete="email" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required minlength="10"></label>
    <p class="err" id="err" role="alert"></p>
    <button class="primary" type="submit" id="go">Sign in</button>
  </form>
</main>
<script>
(function(){
  var q = new URLSearchParams(location.search), mode = "signin", invite = q.get("invite");
  var $ = function(id){ return document.getElementById(id); };
  if (q.get("error")) $("err").textContent = q.get("error");
  fetch("/api/me", {credentials:"same-origin"}).then(function(r){ if (r.ok && !invite) location.replace("/app.html"); });
  fetch("/api/auth/providers").then(function(r){ return r.json(); }).then(function(p){
    if (!p.google) { $("google").setAttribute("aria-disabled","true"); $("google").title = "Not configured on this server"; }
    if (!p.microsoft) { $("microsoft").setAttribute("aria-disabled","true"); $("microsoft").title = "Not configured on this server"; }
    if (!p.signup && !invite) $("tSignup").hidden = true;
  }).catch(function(){});
  function setMode(m){
    mode = m; $("tSignin").setAttribute("aria-pressed", m === "signin"); $("tSignup").setAttribute("aria-pressed", m === "signup");
    $("lName").hidden = m !== "signup"; $("lCompany").hidden = m !== "signup" || !!invite;
    $("go").textContent = m === "signup" ? (invite ? "Join team" : "Create account") : "Sign in";
    $("password").autocomplete = m === "signup" ? "new-password" : "current-password"; $("err").textContent = "";
  }
  $("tSignin").onclick = function(){ setMode("signin"); }; $("tSignup").onclick = function(){ setMode("signup"); };
  if (invite) {
    ["google","microsoft"].forEach(function(p){ $(p).href += "&invite=" + encodeURIComponent(invite); });
    fetch("/api/auth/invite/" + encodeURIComponent(invite)).then(function(r){ return r.json().then(function(j){
      if (!r.ok) { $("err").textContent = j.error; return; }
      $("inviteNote").hidden = false; $("inviteNote").textContent = "You've been invited to join " + j.orgName + ". Create your account to continue.";
      $("email").value = j.email; setMode("signup");
    }); });
  }
  $("f").addEventListener("submit", function(e){
    e.preventDefault(); var b = $("go"); $("err").textContent = "";
    var body = { email: $("email").value.trim(), password: $("password").value };
    if (mode === "signup") { body.name = $("name").value.trim(); body.company = $("company").value.trim() || undefined; if (invite) body.invite = invite;
      if (!body.name) { $("err").textContent = "Enter your name."; return; }
      if (body.password.length < 10) { $("err").textContent = "Use a password of at least 10 characters."; return; } }
    if (!body.email) { $("err").textContent = "Enter your email."; return; }
    b.disabled = true;
    fetch(mode === "signup" ? "/api/auth/register" : "/api/auth/login", {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error || "Something went wrong"); location.replace("/app.html"); }); })
      .catch(function(err){ $("err").textContent = err.message; b.disabled = false; });
  });
})();
</script>
</body>
</html>
